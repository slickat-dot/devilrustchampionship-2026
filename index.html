<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>DevilRust Mini RC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#181818;--bg4:#222;--text:#f0f0f0;--text2:#999;--text3:#555;--orange:#e85d04;--gold:#ffd60a;--silver:#b0b0b0;--bronze:#cd7f32;--border:#252525;--border2:#333}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px}
.hdr-i{max-width:480px;margin:0 auto;display:flex;align-items:center;height:52px;gap:10px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:.5px}
.logo em{color:var(--orange);font-style:normal}
.badge{margin-left:auto;background:var(--orange);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;padding:3px 8px;border-radius:4px;letter-spacing:1.5px}
.nav{position:sticky;top:52px;z-index:99;background:rgba(10,10,10,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-i{max-width:480px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-i::-webkit-scrollbar{display:none}
.nb{flex:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:11px 14px;color:var(--text3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nb.on{color:var(--orange);border-bottom-color:var(--orange)}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.sec{display:none}.sec.on{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ch{background:var(--bg3);padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cht{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.chb{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;background:var(--bg4);color:var(--text2);padding:2px 7px;border-radius:4px}
.dr{display:flex;align-items:center;padding:10px 14px;gap:10px;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.pn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;width:24px;text-align:center;flex-shrink:0}
.g{color:var(--gold)}.s{color:var(--silver)}.b{color:var(--bronze)}.dim{color:var(--text3)}
.dot{width:3px;height:32px;border-radius:2px;flex-shrink:0}
.di{flex:1;min-width:0}
.dn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dteam{font-size:11px;color:var(--text3);margin-top:1px}
.dpts{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;flex-shrink:0}
.dpts small{font-size:10px;font-weight:400;color:var(--text3);margin-left:1px}
.tr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.tr:last-child{border-bottom:none}
.tbar{width:3px;height:40px;border-radius:2px;flex-shrink:0}
.tnw{flex:1;min-width:0}
.tn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpw{height:2px;background:var(--border2);border-radius:2px;margin-top:7px}
.tp{height:2px;border-radius:2px}
.tpts{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;flex-shrink:0}
.tpts small{font-size:10px;font-weight:400;color:var(--text3);margin-left:1px}
.rsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.rsel::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;padding:5px 11px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.seg{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);padding:7px 14px 5px;background:var(--bg3);border-bottom:1px solid var(--border)}
.seg.pen{color:#e74c3c}
.rr{display:flex;align-items:center;padding:8px 14px;gap:9px;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rr.penrow{background:#0d0000}
.rpos{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;width:20px;text-align:center;flex-shrink:0}
.rn{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{font-size:12px;color:var(--text2);flex-shrink:0;font-variant-numeric:tabular-nums}
.rpt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--orange);flex-shrink:0}
.pole-tag{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px;letter-spacing:.5px}
.dnf-tag{background:#300;color:#f55;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.pen-tag{background:#300;color:#f55;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.pen-obs{font-size:11px;color:#c0392b;margin-top:1px;display:block}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stile{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px}
.stile.rec{border-color:var(--orange);background:#0f0500}
.slbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.sv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;line-height:1}
.sv.rec{color:var(--orange)}
.ssub{font-size:11px;color:var(--text2);margin-top:4px}
.ahero{text-align:center;padding:20px 0 16px}
.alogo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:38px;line-height:1;margin-bottom:3px}
.alogo em{color:var(--orange);font-style:normal}
.asub{font-size:11px;color:var(--text2);letter-spacing:2.5px;text-transform:uppercase}
.arow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.arow:last-child{border-bottom:none}
.arow span:first-child{color:var(--text3)}
.arow span:last-child{font-weight:600;font-family:'Barlow Condensed',sans-serif;font-size:15px}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-i"><div class="logo">DEVIL<em>RUST</em> MINI RC</div><div class="badge">2026</div></div></header>
<nav class="nav"><div class="nav-i">
  <button class="nb on" onclick="show('std',this)">Pilotos</button>
  <button class="nb" onclick="show('con',this)">Equipos</button>
  <button class="nb" onclick="show('rac',this)">Fechas</button>
  <button class="nb" onclick="show('sta',this)">Stats</button>
  <button class="nb" onclick="show('abt',this)">Info</button>
</div></nav>
<main class="wrap">
  <section id="std" class="sec on"><div class="card" id="sc"></div></section>
  <section id="con" class="sec"><div class="card" id="cc"></div></section>
  <section id="rac" class="sec"><div class="rsel" id="rs"></div><div class="card" id="rc"></div></section>
  <section id="sta" class="sec"><div class="sgrid" id="sg"></div><div class="card" id="pc"></div></section>
  <section id="abt" class="sec">
    <div class="ahero"><div class="alogo">DEVIL<em>RUST</em></div><div class="asub">Mini RC · Racing Series · 1/43 Scale</div></div>
    <div class="card" id="ac"></div>
  </section>
</main>
<script>
const D={"standings": [{"pos": 1, "name": "Juli Siricman", "pts": 128, "team": "Manthey Rennen RC"}, {"pos": 2, "name": "Daro Gaig", "pts": 105, "team": "Turbio Works"}, {"pos": 3, "name": "Dani Vaquero", "pts": 96, "team": "Manthey Rennen RC"}, {"pos": 4, "name": "Franco Atienza", "pts": 95, "team": "Turbio Works"}, {"pos": 5, "name": "Roy Rigonat", "pts": 80, "team": "Rigonat Racing"}, {"pos": 6, "name": "Lucas Lumby", "pts": 30, "team": "Special Performance"}, {"pos": 7, "name": "Cris Dell oso", "pts": 28, "team": "Special Performance"}, {"pos": 8, "name": "Oscar Fernandez", "pts": 15, "team": "Rigonat Racing"}, {"pos": 9, "name": "Stig", "pts": 0, "team": "RR2"}, {"pos": 10, "name": "Facundo Cuenca", "pts": 0, "team": "RR2"}], "constructors": [{"pos": 1, "name": "Manthey Rennen RC", "pts": 224}, {"pos": 2, "name": "Turbio Works", "pts": 200}, {"pos": 3, "name": "Rigonat Racing", "pts": 95}, {"pos": 4, "name": "Special Performance", "pts": 58}, {"pos": 5, "name": "RR2", "pts": 0}], "poles": [{"pos": 1, "name": "Dani Vaquero", "count": 2}, {"pos": 2, "name": "Franco Atienza", "count": 1}], "record": {"pilot": "Dani Vaquero", "time": 15.49}, "races": [{"round": 1, "classif": [{"pilot": "Franco Atienza", "time": 18.45, "pts": 3, "pole": true}, {"pilot": "Roy Rigonat", "time": 18.58, "pts": 0, "pole": false}, {"pilot": "Juli Siricman", "time": 18.7, "pts": 0, "pole": false}, {"pilot": "Daro Gaig", "time": 19.52, "pts": 0, "pole": false}, {"pilot": "Cris Dell Oso", "time": 24.17, "pts": 0, "pole": false}, {"pilot": "Lucas Lumby", "time": 38.02, "pts": 0, "pole": false}], "s1": [{"pilot": "Juli Siricman", "pts": 15}, {"pilot": "Franco Atienza", "pts": 12}, {"pilot": "Cris Dell Oso", "pts": 10}], "s2": [{"pilot": "Roy Rigonat", "pts": 15}, {"pilot": "Daro Gaig", "pts": 12}, {"pilot": "Lucas Lumby", "pts": 10}], "f1": [{"pilot": "Franco Atienza", "pts": 34, "dnf": false}, {"pilot": "Juli Siricman", "pts": 29, "dnf": false}, {"pilot": "Roy Rigonat", "pts": 25, "dnf": false}], "f2": [{"pilot": "Daro Gaig", "pts": 22, "dnf": false}, {"pilot": "Lucas Lumby", "pts": 20, "dnf": false}, {"pilot": "Cris Dell Oso", "pts": 18, "dnf": false}], "f2_offset": 3, "penalties": []}, {"round": 2, "classif": [{"pilot": "Dani Vaquero", "time": 17.13, "pts": 3, "pole": true}, {"pilot": "Juli Siricman", "time": 18.54, "pts": 0, "pole": false}, {"pilot": "Franco Atienza", "time": 20.35, "pts": 0, "pole": false}, {"pilot": "Daro Gaig", "time": 23.69, "pts": 0, "pole": false}, {"pilot": "Roy Rigonat", "time": 25.41, "pts": 0, "pole": false}, {"pilot": "Oscar Fernandez", "time": 31.04, "pts": 0, "pole": false}], "s1": [{"pilot": "Dani Vaquero", "pts": 15}, {"pilot": "Franco Atienza", "pts": 12}, {"pilot": "Roy Rigonat", "pts": 10}], "s2": [{"pilot": "Juli Siricman", "pts": 15}, {"pilot": "Daro Gaig", "pts": 12}, {"pilot": "Oscar Fernandez", "pts": 10}], "f1": [{"pilot": "Franco Atienza", "pts": 34, "dnf": false}, {"pilot": "Dani Vaquero", "pts": 29, "dnf": false}, {"pilot": "Juli Siricman", "pts": 25, "dnf": false}], "f2": [{"pilot": "Daro Gaig", "pts": 22, "dnf": false}, {"pilot": "Roy Rigonat", "pts": 20, "dnf": false}, {"pilot": "Oscar Fernandez", "pts": 18, "dnf": false}], "f2_offset": 3, "penalties": [{"pilot": "Franco Atienza", "pts": 15, "obs": "Pruebas en pista cerrada"}]}, {"round": 3, "classif": [{"pilot": "Dani Vaquero", "time": 15.49, "pts": 3, "pole": true}, {"pilot": "Daro Gaig", "time": 15.68, "pts": 0, "pole": false}, {"pilot": "Juli Siricman", "time": 16.53, "pts": 0, "pole": false}, {"pilot": "Franco Atienza", "time": 16.74, "pts": 0, "pole": false}, {"pilot": "Roy Rigonat", "time": 17.45, "pts": 0, "pole": false}, {"pilot": "Oscar Fernandez", "time": 19.2, "pts": 0, "pole": false}], "s1": [{"pilot": "Juli Siricman", "pts": 15}, {"pilot": "Dani Vaquero", "pts": 12}, {"pilot": "Roy Rigonat", "pts": 10}], "s2": [{"pilot": "Franco Atienza", "pts": 15}, {"pilot": "Daro Gaig", "pts": 12}, {"pilot": "Oscar Fernandez", "pts": 10}], "f1": [{"pilot": "Dani Vaquero", "pts": 34, "dnf": false}, {"pilot": "Juli Siricman", "pts": 29, "dnf": false}, {"pilot": "Daro Gaig", "pts": 25, "dnf": false}, {"pilot": "Franco Atienza", "pts": 0, "dnf": true}], "f2": [{"pilot": "Oscar Fernandez", "pts": 22, "dnf": false}, {"pilot": "Roy Rigonat", "pts": 0, "dnf": true}], "f2_offset": 3, "penalties": [{"pilot": "Oscar Fernandez", "pts": 45, "obs": "Vehiculo fuera de reglamento"}]}], "teamColors": {"Turbio Works": {"bg": "#FF00FF", "text": "#000"}, "Special Performance": {"bg": "#C8C8C8", "text": "#000"}, "Rigonat Racing": {"bg": "#666666", "text": "#fff"}, "RR2": {"bg": "#111111", "text": "#fff"}, "Manthey Rennen RC": {"bg": "#FF9900", "text": "#000"}}};
const TC=D.teamColors,tc=t=>TC[t]?TC[t].bg:'#444',pc=p=>p===1?'g':p===2?'s':p===3?'b':'dim';
function show(id,btn){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));document.getElementById(id).classList.add('on');btn.classList.add('on')}
document.getElementById('sc').innerHTML='<div class="ch"><span class="cht">Campeonato de Pilotos</span><span class="chb">Fecha '+D.races.length+' / 17</span></div>'+D.standings.map(d=>'<div class="dr"><div class="pn '+pc(d.pos)+'">'+d.pos+'</div><div class="dot" style="background:'+tc(d.team)+'"></div><div class="di"><div class="dn">'+d.name+'</div><div class="dteam">'+d.team+'</div></div><div class="dpts">'+d.pts+'<small>pts</small></div></div>').join('');
const mx=D.constructors[0].pts||1;
document.getElementById('cc').innerHTML='<div class="ch"><span class="cht">Campeonato de Constructores</span><span class="chb">Fecha '+D.races.length+' / 17</span></div>'+D.constructors.map(d=>'<div class="tr"><div class="tbar" style="background:'+tc(d.name)+'"></div><div class="tnw"><div class="tn">'+d.name+'</div><div class="tpw"><div class="tp" style="width:'+Math.round(d.pts/mx*100)+'%;background:'+tc(d.name)+'"></div></div></div><div class="tpts">'+d.pts+'<small>pts</small></div></div>').join('');
let ar=D.races.length-1;
function brs(){document.getElementById('rs').innerHTML=D.races.map((r,i)=>'<button class="chip'+(i===ar?' on':'')+'" onclick="sr('+i+')">Fecha '+r.round+'</button>').join('')}
function sr(i){ar=i;document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j===i));brc()}
function brc(){
  const race=D.races[ar];
  let h='<div class="ch"><span class="cht">Fecha '+race.round+'</span><span class="chb">'+race.classif.length+' pilotos</span></div>';
  h+='<div class="seg">Clasificación</div>';
  race.classif.forEach((c,i)=>{h+='<div class="rr"><div class="rpos '+pc(i+1)+'">'+(i+1)+'</div><div class="rn">'+c.pilot+(c.pole?'<span class="pole-tag">POLE</span>':'')+'</div><div class="rt">'+(c.time?c.time.toFixed(2)+'s':'')+'</div>'+(c.pts?'<div class="rpt" style="color:var(--gold)">+'+c.pts+'</div>':'')+'</div>'});
  if(race.s1.length){h+='<div class="seg">Resultado S1</div>';race.s1.forEach((x,i)=>{h+='<div class="rr"><div class="rpos '+pc(i+1)+'">'+(i+1)+'</div><div class="rn">'+x.pilot+'</div><div class="rpt">'+x.pts+' pts</div></div>'})}
  if(race.s2.length){h+='<div class="seg">Resultado S2</div>';race.s2.forEach((x,i)=>{h+='<div class="rr"><div class="rpos '+pc(i+1)+'">'+(i+1)+'</div><div class="rn">'+x.pilot+'</div><div class="rpt">'+x.pts+' pts</div></div>'})}
  if(race.f1.length){
    h+='<div class="seg">Final 1</div>';
    let p=1;
    race.f1.forEach(x=>{const pos=x.dnf?null:p++;h+='<div class="rr"><div class="rpos '+(x.dnf?'dim':pc(pos))+'">'+(x.dnf?'—':pos)+'</div><div class="rn">'+x.pilot+(x.dnf?'<span class="dnf-tag">DNF</span>':'')+'</div>'+(x.pts?'<div class="rpt">'+x.pts+' pts</div>':'')+'</div>'})
  }
  if(race.f2.length){
    h+='<div class="seg">Final 2</div>';
    let p=race.f2_offset+1;
    race.f2.forEach(x=>{const pos=x.dnf?null:p++;h+='<div class="rr"><div class="rpos '+(x.dnf?'dim':pc(pos))+'">'+(x.dnf?'—':pos)+'</div><div class="rn">'+x.pilot+(x.dnf?'<span class="dnf-tag">DNF</span>':'')+'</div>'+(x.pts?'<div class="rpt">'+x.pts+' pts</div>':'')+'</div>'})
  }
  if(race.penalties&&race.penalties.length){h+='<div class="seg pen">⚑  Penalización</div>';race.penalties.forEach(p=>{h+='<div class="rr penrow"><div class="rpos dim">⚑</div><div class="di"><div class="rn">'+p.pilot+'<span class="pen-tag">-'+p.pts+' pts</span></div><span class="pen-obs">'+p.obs+'</span></div></div>'})}
  document.getElementById('rc').innerHTML=h;
}
brs();brc();
const ldr=D.standings[0];
document.getElementById('sg').innerHTML='<div class="stile rec"><div class="slbl">Record de pista</div><div class="sv rec">'+(D.record.time?D.record.time.toFixed(2):'—')+'<span style="font-size:13px;color:var(--orange)">s</span></div><div class="ssub">'+(D.record.pilot||'—')+'</div></div><div class="stile"><div class="slbl">Líder</div><div class="sv" style="font-size:19px">'+ldr.name.split(' ')[0]+'</div><div class="ssub">'+ldr.pts+' pts · '+ldr.team+'</div></div><div class="stile"><div class="slbl">Fechas</div><div class="sv">'+D.races.length+'<span style="font-size:13px;color:var(--text3)">/17</span></div><div class="ssub">Disputadas</div></div><div class="stile"><div class="slbl">Poles</div><div class="sv">'+D.poles.reduce((a,p)=>a+p.count,0)+'</div><div class="ssub">'+D.poles.length+' pilotos</div></div>';
document.getElementById('pc').innerHTML='<div class="ch"><span class="cht">Pole Positions</span></div>'+D.poles.map((p,i)=>'<div class="dr"><div class="pn '+pc(i+1)+'">'+p.pos+'</div><div class="di"><div class="dn">'+p.name+'</div></div><div style="display:flex;align-items:center;gap:3px">'+'<span style="color:var(--gold);font-size:15px">★</span>'.repeat(p.count)+'<span style="font-family:Barlow Condensed,sans-serif;font-weight:800;font-size:22px;margin-left:3px">'+p.count+'</span></div></div>').join('');
document.getElementById('ac').innerHTML='<div class="arow"><span>Temporada</span><span>2026</span></div><div class="arow"><span>Escala</span><span>1/43</span></div><div class="arow"><span>Fechas totales</span><span>17</span></div><div class="arow"><span>Disputadas</span><span>'+D.races.length+'</span></div><div class="arow"><span>Pilotos</span><span>'+D.standings.length+'</span></div><div class="arow"><span>Equipos</span><span>'+D.constructors.length+'</span></div><div class="arow"><span>Líder</span><span>'+ldr.name+'</span></div><div class="arow"><span>Record de pista</span><span>'+(D.record.time?D.record.time.toFixed(2)+'s — '+D.record.pilot:'—')+'</span></div>';
</script>
</body>
</html>
